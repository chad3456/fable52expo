<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trimurti: live shader</title>
<style>
  html, body { margin: 0; background: #120e1c; color: #f4ead8; font-family: Georgia, 'Times New Roman', serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-weight: 400; font-size: clamp(28px, 5vw, 50px); margin: 0 0 8px; }
  p { color: #b9a9b8; line-height: 1.6; max-width: 760px; }
  a { color: #f0c66a; }
  canvas, img { width: 100%; height: auto; display: block; margin: 20px 0; border-radius: 8px; border: 1px solid #3a2f48; }
</style>
</head>
<body>
<main>
  <h1>Trimurti</h1>
  <p>Shiva, Vishnu-Krishna and Brahma, with Krishna and Arjuna in the pool of light below. The painting is drawn entirely by code; here a fragment shader keeps the aura flowing and the light breathing.</p>
  <canvas id="gl" width="1600" height="1450"></canvas>
  <p><a href="index.html#bharat">Back to the gallery</a></p>
</main>
<script>
(function () {
  var cv = document.getElementById('gl'), gl = cv.getContext('webgl'), img = new Image();
  function still() { var i = new Image(); i.src = 'img/bharat/17.jpg'; i.alt = 'Trimurti'; cv.parentNode.replaceChild(i, cv); }
  if (!gl) return still();
  var VS = 'attribute vec2 a; varying vec2 v; void main(){ v = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); gl_Position = vec4(a, 0.0, 1.0); }';
  var FS = 'precision mediump float; uniform sampler2D t; uniform float time; varying vec2 v;' +
    'float n(vec2 p){ return sin(p.x * 3.1 + time * 0.5) * sin(p.y * 2.7 - time * 0.4); }' +
    'void main(){ vec3 c0 = texture2D(t, v).rgb; float warm = clamp((c0.r - c0.b) * 1.6, 0.0, 1.0); float m = warm * smoothstep(0.62, 0.2, v.x);' +
    ' vec2 w = vec2(n(v * 3.0 + 1.3), n(v.yx * 3.4 + 4.0)) * 0.012 * m; vec3 c = texture2D(t, v + w).rgb;' +
    ' float sweep = smoothstep(0.25, 0.0, abs(v.x + v.y * 0.3 - fract(time * 0.06) * 1.8 + 0.2)); c += c * sweep * 0.18;' +
    ' float d = distance(v, vec2(0.42, 0.68)); c += vec3(0.25, 0.55, 0.75) * exp(-d * d * 38.0) * (0.25 + 0.2 * sin(time * 1.6));' +
    ' float l = dot(c, vec3(0.3, 0.59, 0.11)); c += vec3(1.0, 0.8, 0.5) * smoothstep(0.82, 1.0, l) * 0.15 * (0.6 + 0.4 * sin(time * 2.0 + v.x * 20.0));' +
    ' gl_FragColor = vec4(c, 1.0); }';
  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return still();
  gl.useProgram(pr); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var ut = gl.getUniformLocation(pr, 'time'), calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  img.onload = function () {
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture()); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    (function frame(ms) { gl.uniform1f(ut, calm ? 0 : (ms || 0) / 1000); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); if (!calm) requestAnimationFrame(frame); })(0);
  };
  img.onerror = still; img.src = 'img/bharat/17.jpg';
})();
</script>
</body>
</html>
